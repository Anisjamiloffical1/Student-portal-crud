<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student System{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background: #0d6efd;
            padding-top: 60px;
        }

        .sidebar a {
            color: white;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Main content */
        .main {
            margin-left: 250px;
            padding: 20px;
        }

        /* Top navbar */
        .topbar {
            position: fixed;
            left: 250px;
            right: 0;
            top: 0;
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4 class="text-white text-center">Dashboard</h4>
    <a href="{% url 'home' %}">📊 All Students</a>
    <a href="{% url 'create_student' %}">➕ Add Student</a>
    <a href="#">🆕 Recent Created</a>
    <a href="#">✏️ Recent Updates</a>
    <a href="#">🗑️ Recent Deleted</a>
</div>

<!-- TOP NAVBAR -->
<div class="topbar">
    <h5 class="m-0">Student Management System</h5>

    <div>
        <a href="{% url 'create_student' %}" class="btn btn-primary btn-sm">
            + New Student
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main mt-5 pt-3">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
