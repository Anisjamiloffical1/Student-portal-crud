<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR STYLE TOP BAR -->
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand mb-0 h1">Students Management System</span>

    <a href="{% url 'create_student' %}" class="btn btn-light btn-sm">
        + Create Student
    </a>
</nav>

<div class="container mt-5">

    <!-- PAGE TITLE -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Student Records</h2>
    </div>

    <!-- TABLE CARD -->
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-primary">
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for s in student %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td class="fw-semibold">{{ s.name }}</td>
                            <td>{{ s.age }}</td>
                            <td>{{ s.email }}</td>
                            <td>
                                <a class="btn btn-info" href="{% url 'update_student' s.id %}">Update</a>
                                <a class="btn btn-danger" href="{% url 'delete_student' s.id %}">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">
                                No students found
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
